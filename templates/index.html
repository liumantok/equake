<!DOCTYPE html> <html> <head> <link rel="stylesheet" href="/static/index.css">
    
    <title>Earthquakes</title> </head> <body>
<h1>Earthquakes</h1>

<label for="timeframe">Timeframe:</label>
<select id="timeframe">
    <option value="Past hour">Past hour</option>
    <option value="Past day">Past day</option>
    <option value="Past 7 days">Past 7 days</option>
    <option value="Past 30 days">Past 30 days</option>
</select>

<br><br>

<label for="group">Group:</label>
<select id="group">
    <option value="Significant">Significant</option>
    <option value="M4.5+">M4.5+</option>
    <option value="M2.5+">M2.5+</option>
    <option value="M1.0+">M1.0+</option>
    <option value="All">All</option>
</select>

<br><br>

<button onclick="getEarthquakes()">Get Earthquakes</button>

<ul id="result"></ul>

<script>
    async function getEarthquakes() {

        const timeframe = document.getElementById("timeframe").value;
        const group = document.getElementById("group").value;

        const url =
            `http://127.0.0.1:8000/earthquakes?timeframe=${encodeURIComponent(timeframe)}&group=${encodeURIComponent(group)}`;

        const response = await fetch(url);

        const list = await response.json();
        
        document.getElementById("result").innerHTML = 
            list.map(x => `<li>${x}</li>`).join("");
        
    }
</script>

</body> </html>
